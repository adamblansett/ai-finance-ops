services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-finance-ops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-ai_finance_ops}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-ai_finance_ops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-finance-ops-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-finance-ops-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: AI Finance Operations
      APP_SLUG: ai-finance-ops
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-ai_finance_ops}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      REDIS_URL: redis://redis:6379/0
      TASK_EXECUTION_MODE: ${TASK_EXECUTION_MODE:-inline}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-insecure-secret-change-in-production-32bytes}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-finance-ops-frontend
    ports:
      - "3000:8080"
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    container_name: ai-finance-ops-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-finance-ops-worker
    profiles: ["worker"]
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-ai_finance_ops}
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_TABLES: "false"
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
